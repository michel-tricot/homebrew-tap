name: Update formulae

on:
  schedule:
    - cron: "17 6 * * *"   # daily
  workflow_dispatch:

jobs:
  bearcli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump formula to latest PyPI release
        run: |
          set -euo pipefail
          DATA=$(curl -fsSL https://pypi.org/pypi/bearcli/json)
          URL=$(echo "$DATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(u['url'] for u in d['urls'] if u['packagetype']=='sdist'))")
          SHA=$(echo "$DATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(u['digests']['sha256'] for u in d['urls'] if u['packagetype']=='sdist'))")
          sed -i -E "s|^  url \".*\"|  url \"$URL\"|" Formula/bearcli.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Formula/bearcli.rb
          if git diff --quiet; then
            echo "formula already current"
          else
            VERSION=$(echo "$DATA" | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "bearcli $VERSION"
            git push
          fi
